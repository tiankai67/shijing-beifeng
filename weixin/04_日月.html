  <h1 style="font-size:34px;color:#9e2b25;text-align:center;letter-spacing:8px;font-weight:normal;margin:8px 0 4px;">日月</h1>
  <div style="font-size:14px;color:#6b5638;text-align:center;letter-spacing:2px;">rì yuè　·　自然之韵</div>
  <div style="text-align:center;margin:14px 0 6px;">
    <span style="display:inline-block;font-size:13px;color:#fff;background:#9e2b25;padding:3px 14px;border-radius:2px;letter-spacing:2px;">日月起兴 · 高古开阔</span>
  </div>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:20px 0 10px;">译 文</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">太阳月亮放光芒，光明照彻大地上。太阳月亮放光芒，每天升起在东方。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">注 释</h2>
  <p style="font-size:15px;color:#4a3826;margin:4px 0;">居、诸（jū、zhū）：语助词，无实义。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">照临（zhào lín）：照耀、光临。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">赏 析</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">以日月永恒起兴，反衬人事变迁、忧思难遣。重章叠句，气象开阔，是《邶风》中格调高古之作。</p>
