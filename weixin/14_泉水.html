  <div style="font-size:13px;color:#8a6d3b;letter-spacing:6px;text-align:center;">詩 經 · 邶 風</div>
  <h1 style="font-size:34px;color:#9e2b25;text-align:center;letter-spacing:8px;font-weight:normal;margin:8px 0 4px;">泉水</h1>
  <div style="font-size:14px;color:#6b5638;text-align:center;letter-spacing:2px;">quán shuǐ　·　乡愁之深</div>
  <div style="text-align:center;margin:14px 0 6px;">
    <span style="display:inline-block;font-size:13px;color:#fff;background:#9e2b25;padding:3px 14px;border-radius:2px;letter-spacing:2px;">卫女思归 · 魂牵故园</span>
  </div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:20px 0;">❦　❦　❦</div>

  <div style="font-size:16px;color:#4a3826;text-align:center;">原文 · 竖排（手机长按可保存）</div>
  <img src="14_泉水_竖排长图.png" alt="邶风泉水竖排" style="width:100%;display:block;margin:14px auto 8px;border:1px solid #d8c9a8;" />
  <div style="font-size:13px;color:#8a6d3b;text-align:center;">（横屏或双指放大，可见笔意）</div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:22px 0 14px;">❦　❦　❦</div>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:20px 0 10px;">译 文</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">怀念卫国我故乡，没有一天不在想。我是思绪在肥泉，声声叹息用不休。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">注 释</h2>
  <p style="font-size:15px;color:#4a3826;margin:4px 0;">有怀（yǒu huái）：有所怀念。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">靡（mǐ）：无、没有。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">兹（zī）：此、这。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">赏 析</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">卫女思归，念肥泉而长叹。以泉水起兴，写尽对故国故园的魂牵梦萦，是《邶风》乡愁主题的代表。</p>
