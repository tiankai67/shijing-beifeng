  <div style="font-size:13px;color:#8a6d3b;letter-spacing:6px;text-align:center;">詩 經 · 邶 風</div>
  <h1 style="font-size:34px;color:#9e2b25;text-align:center;letter-spacing:8px;font-weight:normal;margin:8px 0 4px;">柏舟</h1>
  <div style="font-size:14px;color:#6b5638;text-align:center;letter-spacing:2px;">bǎi zhōu　·　品格之坚</div>
  <div style="text-align:center;margin:14px 0 6px;">
    <span style="display:inline-block;font-size:13px;color:#fff;background:#9e2b25;padding:3px 14px;border-radius:2px;letter-spacing:2px;">我心匪石 · 坚守本心</span>
  </div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:20px 0;">❦　❦　❦</div>

  <div style="font-size:16px;color:#4a3826;text-align:center;">原文 · 竖排（手机长按可保存）</div>
  <img src="01_柏舟_竖排长图.png" alt="邶风柏舟竖排" style="width:100%;display:block;margin:14px auto 8px;border:1px solid #d8c9a8;" />
  <div style="font-size:13px;color:#8a6d3b;text-align:center;">（横屏或双指放大，可见笔意）</div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:22px 0 14px;">❦　❦　❦</div>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:20px 0 10px;">译 文</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">我心并非卵石圆，不能随便来滚转；我心并非草席软，不能任意来翻卷。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">注 释</h2>
  <p style="font-size:15px;color:#4a3826;margin:4px 0;">匪（fěi）：非，不是。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">转（zhuǎn）：转动、移动。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">卷（juǎn）：卷起。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">赏 析</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">以“石”“席”为喻，表心志坚贞、不可移易。后世常以“我心匪石”喻坚守本心、不为外物所动，是中华品格精神的经典意象。</p>
