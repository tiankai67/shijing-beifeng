  <h1 style="font-size:34px;color:#9e2b25;text-align:center;letter-spacing:8px;font-weight:normal;margin:8px 0 4px;">二子乘舟</h1>
  <div style="font-size:14px;color:#6b5638;text-align:center;letter-spacing:2px;">èr zǐ chéng zhōu　·　乡愁之深</div>
  <div style="text-align:center;margin:14px 0 6px;">
    <span style="display:inline-block;font-size:13px;color:#fff;background:#9e2b25;padding:3px 14px;border-radius:2px;letter-spacing:2px;">舟影渐远 · 离散之思</span>
  </div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:20px 0;">❦　❦　❦</div>

  <div style="font-size:16px;color:#4a3826;text-align:center;">原文 · 竖排（手机长按可保存）</div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:22px 0 14px;">❦　❦　❦</div>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:20px 0 10px;">译 文</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">你俩乘船走了，船儿飘飘远去。多么思念你呵，心中恋意难除。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">注 释</h2>
  <p style="font-size:15px;color:#4a3826;margin:4px 0;">泛泛（fàn fàn）：漂流的样子。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">景（jǐng）：同“憬”，远去之影。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">养养（yǎng yǎng）：忧思不绝的样子。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">赏 析</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">二子乘舟远去，送者中心养养。以舟影渐远写兄弟（或友人）离散之思，情韵悠长，余味不尽。</p>
