  <h1 style="font-size:34px;color:#9e2b25;text-align:center;letter-spacing:8px;font-weight:normal;margin:8px 0 4px;">燕燕</h1>
  <div style="font-size:14px;color:#6b5638;text-align:center;letter-spacing:2px;">yàn yàn　·　自然之韵</div>
  <div style="text-align:center;margin:14px 0 6px;">
    <span style="display:inline-block;font-size:13px;color:#fff;background:#9e2b25;padding:3px 14px;border-radius:2px;letter-spacing:2px;">万古送别之祖</span>
  </div>

  <div style="text-align:center;color:#c9a25a;letter-spacing:10px;margin:20px 0;">❦　❦　❦</div>

  <div style="font-size:16px;color:#4a3826;text-align:center;">原文 · 竖排（手机长按可保存）</div>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:20px 0 10px;">译 文</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">燕子展开翅膀飞，下下上上发呢喃。性格温柔又和顺，行为善良又谨慎。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">注 释</h2>
  <p style="font-size:15px;color:#4a3826;margin:4px 0;">于飞（yú fēi）：飞翔的样子。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">终…且…（zhōng…qiě…）：既…又…，并列连词。</p><p style="font-size:15px;color:#4a3826;margin:4px 0;">淑慎（shū shèn）：善良而谨慎。</p>

  <h2 style="font-size:18px;color:#9e2b25;border-left:4px solid #c9a25a;padding-left:10px;margin:22px 0 10px;">赏 析</h2>
  <p style="font-size:16px;color:#4a3826;margin:6px 0;text-indent:2em;">以燕燕双飞起兴，寄送别之思。清代王士祯推为“万古送别之祖”，徐悲鸿名画《燕燕于飞》即源于此篇。</p>
